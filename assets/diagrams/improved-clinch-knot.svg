<title id="title">How to tie an Improved Clinch knot</title><desc id="desc">Four numbered line drawings show threading the eye, making turns, passing the tag through both loops, and tightening the knot.</desc>
<rect width="1200" height="340" fill="#f7fbfc"/><g font-family="Arial,sans-serif"><g fill="#e7f2f3"><rect x="12" y="12" width="282" height="316" rx="16"/><rect x="310" y="12" width="282" height="316" rx="16"/><rect x="608" y="12" width="282" height="316" rx="16"/><rect x="906" y="12" width="282" height="316" rx="16"/></g><g fill="#07566c" font-size="17" font-weight="700"><text x="34" y="44">1  Thread the eye</text><text x="332" y="44">2  Make 5–7 turns</text><text x="630" y="44">3  Pass through both loops</text><text x="928" y="44">4  Moisten and tighten</text></g></g>
