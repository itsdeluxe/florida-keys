<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">How to tie a Double Uni knot</title><desc id="desc">Four numbered line drawings show overlapping braid and leader, wrapping the braid, wrapping the leader, and pulling the two knots together.</desc>
